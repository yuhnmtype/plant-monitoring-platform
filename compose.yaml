name: plantmon

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: plantmon
      POSTGRES_USER: plantmon
      # shortcut: no password for simulated data on localhost, upgrade before any shared deployment.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantmon -d plantmon"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db_data:
